<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistance 🇵🇸 - Gallery</title>
        <link rel="stylesheet" href="styles/index.css" type="text/css">
    <link rel="icon" href="imgs/outLand.png" type="image/png">
    <link rel="stylesheet" href="styles/gallery.css">
    <script src="components/layout.js"></script>
</head>

<body>

    <div class="container">
        <h1 class="gallery-title">Gallery</h1>

        <!-- Slideshow container -->
        <div class="slideshow-container">
            <!-- Full-width images with number text -->
            <div class="mySlides fade">
                <img src="imgs/gallery/00.jpeg" alt="Resistance Image 1">
            </div>

            <div class="mySlides fade">
                <img src="imgs/gallery/01.jpeg" alt="Resistance Image 2">
            </div>

            <div class="mySlides fade">
                <img src="imgs/gallery/02.jpeg" alt="Resistance Image 3">
            </div>

            <div class="mySlides fade">
                <img src="imgs/gallery/04.jpeg" alt="Resistance Image 4">
            </div>

            <div class="mySlides fade">
                <img src="imgs/gallery/05.jpeg" alt="Resistance Image 5">
            </div>

            <div class="mySlides fade">
                <img src="imgs/gallery/06.jpeg" alt="Resistance Image 5">
            </div>

            <div class="mySlides fade">
                <img src="imgs/gallery/07.jpeg" alt="Resistance Image 5">
            </div>

            <div class="mySlides fade">
                <img src="imgs/gallery/08.jpeg" alt="Resistance Image 5">
            </div>
            <!-- Next and previous buttons -->
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>

        <!-- The dots/circles -->
        <div class="slideshow-dots">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
            <span class="dot" onclick="currentSlide(5)"></span>
            <span class="dot" onclick="currentSlide(6)"></span>
            <span class="dot" onclick="currentSlide(7)"></span>
            <span class="dot" onclick="currentSlide(8)"></span>
        </div>

        <!-- Gallery Grid -->

    </div>

    <footer>
        built with resistance for 🇵🇸
    </footer>

    <script>
        let slideIndex = 0;
        showSlides();

        function showSlides() {
            let i;
            let slides = document.getElementsByClassName("mySlides");
            let dots = document.getElementsByClassName("dot");

            // Hide all slides
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }

            // Increment slide index
            slideIndex++;

            // Reset to first slide if at the end
            if (slideIndex > slides.length) {
                slideIndex = 1;
            }

            // Remove active class from all dots
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }

            // Show current slide and activate corresponding dot
            slides[slideIndex - 1].style.display = "block";
            dots[slideIndex - 1].className += " active";

            // Change image every 4 seconds
            setTimeout(showSlides, 3000);
        }

        // Manual navigation functions
        function plusSlides(n) {
            slideIndex += n - 1; // Adjust for the auto-increment in showSlides
            showSlides();
        }

        function currentSlide(n) {
            slideIndex = n - 1; // Adjust for the auto-increment in showSlides
            showSlides();
        }
    </script>
</body>

</html>
